<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Dogs: Pixel-Prototypen</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2e1d14; --cream: #fff6e6; --edge: #e9d2bd; --brown: #4a3426; --muted: #7a5a46; --red: #c24535; }
  html, body { margin: 0; height: 100%; background: #f6ead4; color: var(--brown); font: 500 16px 'Pixelify Sans', monospace; }
  body { display: grid; grid-template-columns: 300px 1fr; }
  aside { overflow-y: auto; padding: 16px; border-right: 4px solid var(--ink); background: var(--cream); }
  h1 { font: 700 26px 'Pixelify Sans'; margin: 0 0 12px; }
  h2 { font: 600 13px 'Pixelify Sans'; letter-spacing: 2px; color: var(--muted); margin: 18px 0 6px; }
  button.scene { display: block; width: 100%; text-align: left; margin: 4px 0; padding: 8px 10px; font: 600 16px 'Pixelify Sans'; color: var(--brown);
    background: var(--cream); border: 3px solid var(--ink); box-shadow: 0 3px 0 rgba(46,29,20,.25); cursor: pointer; }
  button.scene:hover { background: #fff0d6; }
  button.scene.on { background: var(--red); color: var(--cream); }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0; }
  select, input[type=text], input[type=number] { font: 500 15px 'Pixelify Sans'; width: 150px; padding: 3px 6px; border: 2px solid var(--ink); background: #fff; color: var(--brown); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row button { font: 600 14px 'Pixelify Sans'; padding: 4px 8px; border: 2px solid var(--ink); background: #fff; color: var(--brown); cursor: pointer; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  main { display: flex; flex-direction: column; min-width: 0; }
  .bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 4px solid var(--ink); background: var(--cream); }
  .bar code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 13px monospace; color: var(--muted); }
  .bar a, .bar button { font: 600 14px 'Pixelify Sans'; color: var(--cream); background: var(--red); border: 2px solid var(--ink); padding: 4px 10px; text-decoration: none; cursor: pointer; }
  iframe { flex: 1; width: 100%; border: 0; background: #000; }
  .only { display: none; }
  body[data-scene="alert"] .only.alert, body[data-scene="sheet"] .only.sheet, body[data-scene="pixel"] .only.pixel { display: block; }
  body[data-scene="pixel"] .dogbox { display: none; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body data-scene="starting">
<aside>
  <h1>Dogs: Pixel-Prototypen</h1>

  <h2>SZENEN</h2>
  <div id="scenes"></div>

  <div class="dogbox">
    <h2>HUND</h2>
    <label>Rasse <select id="dog"></select></label>
    <label>Fell <select id="coat"></select></label>
    <label>Name <input id="name" type="text" value="Bello"></label>
  </div>

  <div class="only alert">
    <h2>ALERT</h2>
    <label>Art <select id="type">
      <option value="follow">Follow</option><option value="sub">Abo</option><option value="bits">Bits</option>
      <option value="donation">Spende</option><option value="raid">Raid</option></select></label>
    <label>Raider <input id="raiders" type="number" min="0" max="5000" value="42"></label>
    <div class="row" id="raidPresets"></div>
    <label>Max. gleichzeitig <input id="max" type="number" min="1" max="60" value="12"></label>
    <label>Hintergrund <select id="bg"><option value="game">Spiel</option><option value="checker">transparent</option><option value="none">schwarz</option></select></label>
    <div class="hint">Raider und Max. gelten nur bei Art "Raid". Die Knöpfe setzen die Art auf Raid.</div>
  </div>

  <div class="only sheet">
    <h2>POSE</h2>
    <label>Modus <select id="mode"><option value="stand">stehen</option><option value="walk">laufen</option><option value="bark">bellen</option><option value="lie">liegen</option></select></label>
  </div>

  <div class="only pixel">
    <h2>CORGI-PROBE</h2>
    <label>Fell <select id="probeCoat"><option value="">Palette</option><option>Rot-Weiss</option><option>Zobel-Weiss</option><option>Hell</option></select></label>
  </div>

  <h2>ZEIT</h2>
  <label><span>Standbild</span><input id="still" type="checkbox"></label>
  <label>t = <span id="tval">3.0 s</span></label>
  <input id="t" type="range" min="0" max="20" step="0.1" value="3" style="width:100%">
  <div class="hint">Ohne Standbild läuft die Szene live von vorn. Mit Standbild zeigt der Regler den Zeitpunkt.</div>

  <h2>TON</h2>
  <label><span>Ton aus</span><input id="mute" type="checkbox" checked></label>
</aside>
<main>
  <div class="bar"><code id="url"></code><button id="reload">Neu starten</button><a id="open" target="_blank">In neuem Tab</a></div>
  <iframe id="frame" title="Prototyp"></iframe>
</main>
<script type="module">
// Overview of the pixel prototypes: pick a scene, set dog, alert and time, the page loads in the frame on the right.
import { BREED_IDS, BREEDS } from './pixeldogs.js';

const SCENES = [
  { id: 'starting', label: 'Starting', page: 'px-starting.html', max: 20 },
  { id: 'alert', label: 'Alert', page: 'px-alert.html', max: 30 },
  { id: 'brb', label: 'BRB (Gassi)', page: 'px-brb.html', max: 30 },
  { id: 'ending', label: 'Ending', page: 'px-ending.html', max: 12 },
  { id: 'stinger', label: 'Stinger', page: 'px-stinger.html', max: 2.4 },
  { id: 'sheet', label: 'Alle Rassen', page: 'pxsheet.html', max: 5 },
  { id: 'pixel', label: 'Corgi-Probe', page: 'pixel.html', max: 5 },
];
const $ = (id) => document.getElementById(id);
const state = { scene: 'starting' };

for (const scene of SCENES) {
  const button = Object.assign(document.createElement('button'), { className: 'scene', textContent: scene.label });
  button.dataset.id = scene.id;
  button.onclick = () => { state.scene = scene.id; render(); };
  $('scenes').appendChild(button);
}
for (const id of BREED_IDS) $('dog').append(new Option(BREEDS[id].name, id));
const fillCoats = () => {
  $('coat').innerHTML = '';
  for (const [id, coat] of Object.entries(BREEDS[$('dog').value].coats)) $('coat').append(new Option(coat.name, id));
};
$('dog').value = 'corgi';
fillCoats();
$('dog').onchange = () => { fillCoats(); render(); };
for (const count of [5, 15, 50, 100, 500, 1000]) {
  const button = Object.assign(document.createElement('button'), { textContent: count });
  button.onclick = () => { $('raiders').value = count; $('type').value = 'raid'; render(); };
  $('raidPresets').appendChild(button);
}
for (const id of ['coat', 'name', 'type', 'raiders', 'max', 'bg', 'mode', 'probeCoat', 'still', 'mute']) $(id).onchange = render;
$('t').oninput = () => { $('tval').textContent = `${Number($('t').value).toFixed(1)} s`; if ($('still').checked) render(); };
$('reload').onclick = () => { $('frame').src = 'about:blank'; setTimeout(() => { $('frame').src = urlFor(); }, 50); };

function urlFor() {
  const scene = SCENES.find((entry) => entry.id === state.scene);
  const query = new URLSearchParams();
  if (scene.id !== 'pixel' && scene.id !== 'sheet') {
    query.set('dog', $('dog').value);
    query.set('coat', $('coat').value);
    query.set('name', $('name').value);
  }
  if (scene.id === 'alert') {
    query.set('type', $('type').value);
    if ($('type').value === 'raid') { query.set('raiders', $('raiders').value); query.set('max', $('max').value); }
    if ($('bg').value !== 'game') query.set('bg', $('bg').value);
    query.set('clean', '');
  }
  if (scene.id === 'sheet') query.set('mode', $('mode').value);
  if (scene.id === 'pixel' && $('probeCoat').value) query.set('coat', $('probeCoat').value);
  if ($('still').checked) query.set('t', $('t').value);
  if ($('mute').checked) query.set('sound', '0');
  return `${scene.page}?${query.toString().replace(/=(&|$)/g, '$1')}`;
}

function render() {
  const scene = SCENES.find((entry) => entry.id === state.scene);
  document.body.dataset.scene = scene.id;
  for (const button of document.querySelectorAll('button.scene')) button.classList.toggle('on', button.dataset.id === scene.id);
  $('t').max = scene.max;
  if (Number($('t').value) > scene.max) $('t').value = scene.max;
  $('tval').textContent = `${Number($('t').value).toFixed(1)} s`;
  const url = urlFor();
  $('url').textContent = url;
  $('open').href = url;
  $('frame').src = url;
}
render();
</script>
</body>
</html>
