<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Chaos Alert Pixi Rough</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/DrawSVGPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/Physics2DPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/CustomEase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  :root { --magenta: #d123a0; --magenta-text: #ff5ccb; --cyan: #09d0fe; --card: #2b2041; --lilac: #d39dd4; --muted: #b8a6c4; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: "Space Grotesk", sans-serif; color: #fff; }
  /* preview only: checker stands for the transparent overlay over a game */
  body { background: repeating-conic-gradient(#3a3d44 0 25%, #33363c 0 50%) 0 0 / 40px 40px; }
  canvas { position: absolute; inset: 0; }
  .note { position: absolute; left: 560px; top: 120px; width: 800px; height: 300px; transform: rotate(-1.5deg); }
  .note svg.edge { position: absolute; left: -12px; top: -12px; width: 824px; height: 324px; overflow: visible; }
  .note svg.edge path { filter: drop-shadow(0 0 6px #d123a0); }
  .note .fill { position: absolute; inset: 0; background: rgba(43,32,65,.96); clip-path: polygon(0 3%, 99% 0, 100% 96%, 1% 100%); }
  .note .content { position: absolute; inset: 0; text-align: center; padding-top: 38px; }
  .tapeTop { position: absolute; left: 330px; top: -22px; width: 150px; height: 40px; background: rgba(211,157,212,.85); transform: rotate(3deg);
             background-image: repeating-linear-gradient(90deg, transparent 0 14px, rgba(18,9,16,.18) 14px 16px); }
  .tag { display: inline-block; padding: 6px 18px; background: var(--lilac); color: #120910; font: 700 24px "Space Grotesk"; letter-spacing: 4px; transform: rotate(-2deg); }
  .name { font: 400 104px "Permanent Marker"; line-height: 1.15; color: var(--magenta-text); padding: 0 40px;
          text-shadow: 0 0 6px #fff4fb, 0 0 18px var(--magenta), 0 0 40px var(--magenta);
          -webkit-mask-image: linear-gradient(90deg, #000 0 45%, transparent 55%); -webkit-mask-size: 300% 100%; -webkit-mask-repeat: no-repeat; }
  .line { font: 700 30px "Space Grotesk"; }
  .quote { font: 500 italic 26px "Space Grotesk"; color: var(--muted); margin-top: 6px; }
  svg.timer { position: absolute; left: 600px; top: 440px; width: 720px; height: 30px; overflow: visible; }
  svg.confetti { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
  .note, svg.timer { visibility: hidden; }
</style>
</head>
<body>
<div class="note" id="note">
  <div class="fill"></div>
  <svg class="edge" id="edge" viewBox="0 0 824 324"></svg>
  <div class="tapeTop"></div>
  <div class="content">
    <span class="tag" id="tag">NEUES ABO</span>
    <div class="name" id="name">TRINITY</div>
    <div class="line" id="line">Trinity sprüht ab jetzt mit!</div>
    <div class="quote" id="quote">„Endlich abonniert!“</div>
  </div>
</div>
<svg class="timer" id="timer" viewBox="0 0 720 30"></svg>
<svg class="confetti" id="confetti" viewBox="0 0 1920 1080"></svg>
<script type="module">
gsap.registerPlugin(DrawSVGPlugin, Physics2DPlugin, CustomEase);
gsap.ticker.lagSmoothing(0);
CustomEase.create("stempel", "M0,0 C0.05,0.9 0.1,1.08 0.2,1.04 0.4,0.98 0.6,1 1,1");
const at = new URLSearchParams(location.search).get("t");
await document.fonts.ready;
let s = 77; const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
const between = (a, b) => a + rnd() * (b - a);

const app = new PIXI.Application();
await app.init({ width: 1920, height: 1080, antialias: true, autoStart: false, backgroundAlpha: 0, preference: "webgl" });
document.body.prepend(app.canvas);
const { Container, Graphics, BlurFilter } = PIXI;

// no swathes: only a short spray burst around the note when it hits the wall, dots placed from time only
const mist = new Graphics(); mist.blendMode = "add"; app.stage.addChild(mist);
const mistDots = Array.from({ length: 220 }, () => { const side = Math.floor(rnd() * 4), u = rnd();
  const x = side < 2 ? 560 + u * 800 : (side === 2 ? 560 : 1360), y = side < 2 ? (side === 0 ? 120 : 420) : 120 + u * 300;
  const a = rnd() * Math.PI * 2; return { x, y, vx: Math.cos(a) * between(60, 260), vy: Math.sin(a) * between(60, 260), r: between(1, 3.2), c: [0xd123a0, 0x09d0fe, 0xd39dd4][Math.floor(rnd() * 3)] }; });
const HIT = .45;
function paintMist(t) {
  mist.clear(); const k = t - HIT; if (k <= 0 || k > 1.2) return;
  const drag = 1 - Math.exp(-k * 4);
  for (const d of mistDots) mist.circle(d.x + d.vx * drag / 4 * 4, d.y + d.vy * drag / 4 * 4 + 40 * k * k, d.r).fill({ color: d.c, alpha: .8 * (1 - k / 1.2) });
}

// the note: rough marker edge drawn by rough.js, tape on top
const edge = document.getElementById("edge"), re = rough.svg(edge);
const edgeNode = re.polygon([[12, 22], [810, 12], [812, 300], [20, 312]], { stroke: "#d123a0", strokeWidth: 4, roughness: 2.2, bowing: 1.5, seed: 5 });
edge.appendChild(edgeNode);
// remaining time: a rough cyan marker stroke that pulls back
const timer = document.getElementById("timer"), rt = rough.svg(timer);
const timerNode = rt.line(0, 15, 720, 12, { stroke: "#09d0fe", strokeWidth: 8, roughness: 1.6, seed: 9 }); timerNode.style.filter = "drop-shadow(0 0 6px #09d0fe)";
timer.appendChild(timerNode);
// confetti: small rough scribbles (stars, X, bolts) thrown out of the note with Physics2D (seeded, so a still is stable)
const conf = document.getElementById("confetti"), rcf = rough.svg(conf);
const star = r => Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * .45 : r; return [Math.cos(a) * q, Math.sin(a) * q]; });
const confColors = ["#ff5ccb", "#09d0fe", "#d39dd4", "#ffffff"];
const confetti = Array.from({ length: 34 }, (_, i) => {
  const c = confColors[i % 4], o = { stroke: c, strokeWidth: 3, roughness: 1.6, seed: 40 + i };
  const kind = i % 3, node = kind === 0 ? rcf.polygon(star(16), o) : kind === 1 ? rcf.path("M-12 -12 L12 12 M12 -12 L-12 12", o) : rcf.polygon([[-4, -16], [8, -16], [0, -2], [10, -2], [-6, 16], [-2, 2], [-10, 2]], { ...o, fill: c, fillStyle: "solid" });
  node.style.filter = `drop-shadow(0 0 4px ${c})`;
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.appendChild(node); conf.appendChild(g);
  gsap.set(g, { x: 960, y: 270, opacity: 0 });
  return { g, velocity: between(700, 1300), angle: between(-170, -10), rot: between(-540, 540) };
});

const tl = gsap.timeline({ repeat: -1, repeatDelay: 1 });
// the note is slapped onto the wall: too big, then flat against it
tl.set(["#note", "#timer"], { visibility: "visible" }, .25);
tl.fromTo("#note", { scale: 1.35, rotate: 6, opacity: 0 }, { scale: 1, rotate: -1.5, opacity: 1, duration: .32, ease: "back.out(2.8)" }, .25);
tl.from([...edgeNode.querySelectorAll("path")], { drawSVG: "0%", duration: .5, ease: "power1.inOut" }, .35);
tl.from("#tag", { scale: 0, rotate: -20, duration: .3, ease: "back.out(3)" }, .5);
// the name is sprayed from left to right
tl.fromTo("#name", { webkitMaskPosition: "100% 0" }, { webkitMaskPosition: "0% 0", duration: .8, ease: "power1.inOut" }, .6);
tl.set("#name", { webkitMaskImage: "none" }, 1.45);
tl.from("#line", { opacity: 0, y: 14, duration: .3 }, 1.2);
tl.from("#quote", { opacity: 0, y: 14, duration: .3 }, 1.4);
confetti.forEach((c, i) => {
  tl.set(c.g, { x: 960, y: 270, opacity: 1, rotation: 0 }, .3);
  tl.to(c.g, { duration: 2.2, physics2D: { velocity: c.velocity, angle: c.angle, gravity: 1400 }, rotation: c.rot, ease: "none" }, .3 + i * .008);
  tl.to(c.g, { opacity: 0, duration: .4 }, 2.2 + i * .008);
});
tl.from([...timerNode.querySelectorAll("path")], { drawSVG: "0%", duration: .4 }, .9);
tl.to([...timerNode.querySelectorAll("path")], { drawSVG: "0% 0%", duration: 4.4, ease: "none" }, 1.4);
// glitch exit: offset in magenta and cyan, then gone; the swathes pull back
tl.to("#note", { keyframes: [{ x: -18, filter: "drop-shadow(12px 0 0 #09d0fe) drop-shadow(-12px 0 0 #d123a0)" }, { x: 14 }, { x: 0, opacity: 0, filter: "none" }], duration: .3, ease: "steps(3)" }, 6.0);
tl.set("#timer", { visibility: "hidden" }, 6.0);
if (at) tl.pause(Number(at));

gsap.ticker.add(() => {
  paintMist(tl.time());
  app.renderer.render(app.stage);
});
</script>
</body>
</html>
