<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Plantage Alert Pixi</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/CustomEase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.js"></script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: "Baloo 2", sans-serif; }
  /* preview only: checker stands for the transparent overlay over a game */
  body { background: repeating-conic-gradient(#3a3d44 0 25%, #33363c 0 50%) 0 0 / 40px 40px; }
  canvas { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .frost { background: rgba(255,246,223,.9); backdrop-filter: blur(14px) saturate(1.2); border: 1.5px solid rgba(255,255,255,.8); border-radius: 28px;
           box-shadow: inset 0 2px 0 rgba(255,255,255,.95), 0 24px 48px rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.2); }
  .card { position: absolute; left: 720px; top: 110px; width: 800px; height: 240px; box-sizing: border-box; padding: 26px 44px 0 220px; color: #3a2410; z-index: 0; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 6px 18px 6px 12px; border-radius: 999px; background: #2f8f3a; color: #fff;
          font: 800 18px "Baloo 2"; letter-spacing: 3px; box-shadow: 0 5px 12px rgba(29,94,39,.35), inset 0 2px 0 rgba(255,255,255,.25); }
  .pill i { width: 12px; height: 12px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: radial-gradient(circle at 35% 30%, #ffe08a, #ffb02e 45%, #ff5e3a); }
  .name { font: 700 74px Fredoka; line-height: 1.05; margin-top: 4px; color: #e8670f; text-shadow: 0 3px 0 rgba(255,255,255,.7); }
  .line { font: 600 26px "Baloo 2"; color: #4a2e14; }
  .quote { font: 500 italic 22px "Baloo 2"; color: #7a5536; }
  /* paper medallion with a wooden ring, the mango lands on it */
  .medal { position: absolute; left: 600px; top: 92px; width: 260px; height: 260px; border-radius: 50%; z-index: 1;
           background: radial-gradient(circle at 38% 32%, #fffaf0 0 40%, #fbe9c6 72%, #f1d6a4 100%);
           box-shadow: 0 0 0 12px #c8935a, 0 0 0 16px #7a4a24, inset 0 6px 0 rgba(255,255,255,.8), inset 0 -10px 18px rgba(122,74,36,.25), 0 26px 44px rgba(0,0,0,.4); }
  .branch { position: absolute; left: 940px; top: 362px; width: 520px; height: 14px; border-radius: 8px; z-index: 1; transform-origin: left center;
            background: linear-gradient(#8a5a33, #5a3a1e); box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 6px 10px rgba(0,0,0,.3); }
  .branch i { position: absolute; top: -14px; width: 26px; height: 14px; border-radius: 0 100% 0 100%; background: linear-gradient(135deg, #58b84a, #2f8f3a); }
  .card, .medal, .branch { visibility: hidden; }
</style>
</head>
<body>
<div class="medal" id="medal"></div>
<div class="frost card" id="card">
  <span class="pill"><i></i>NEUER FOLLOWER</span>
  <div class="name" id="name">Trinity</div>
  <div class="line" id="line">Trinity hilft jetzt bei der Ernte!</div>
  <div class="quote" id="quote">„Endlich abonniert!“</div>
</div>
<div class="branch" id="branch"><i style="left:60px"></i><i style="left:190px;transform:scaleX(-1)"></i><i style="left:330px"></i><i style="left:450px;transform:scaleX(-1)"></i></div>
<script type="module">
gsap.registerPlugin(SplitText, CustomEase);
gsap.ticker.lagSmoothing(0);
CustomEase.create("federnd", "M0,0 C0.2,0 0.3,1.2 0.5,1.2 0.62,1.2 0.68,0.94 0.8,0.94 0.88,0.94 0.92,1.02 1,1");
const at = new URLSearchParams(location.search).get("t");
await document.fonts.ready;

const app = new PIXI.Application();
await app.init({ width: 1920, height: 1080, antialias: true, autoStart: false, backgroundAlpha: 0, preference: "webgl" });
document.body.prepend(app.canvas);
const { Container, Graphics, Sprite, Texture } = PIXI;
let s = 7; const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };

// glossy mango drawn once on a canvas: light top left, red towards the bottom right, a leaf on the stem
const mangoTexture = (() => {
  const c = document.createElement("canvas"); c.width = 220; c.height = 240; const g = c.getContext("2d");
  g.save(); g.translate(110, 132); g.rotate(-.35);
  const body = g.createRadialGradient(-30, -40, 6, 0, 0, 110);
  body.addColorStop(0, "#fff1b0"); body.addColorStop(.25, "#ffc23e"); body.addColorStop(.62, "#ff8c1a"); body.addColorStop(1, "#e2452a");
  g.fillStyle = body; g.beginPath(); g.ellipse(0, 0, 78, 96, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = "rgba(255,255,255,.75)"; g.beginPath(); g.ellipse(-30, -48, 16, 24, -.5, 0, Math.PI * 2); g.fill();
  g.restore();
  const leaf = g.createLinearGradient(110, 10, 190, 50); leaf.addColorStop(0, "#58b84a"); leaf.addColorStop(1, "#1d5e27");
  g.fillStyle = "#6d4c2f"; g.fillRect(96, 22, 10, 22);
  g.fillStyle = leaf; g.beginPath(); g.moveTo(104, 30); g.quadraticCurveTo(150, -6, 196, 30); g.quadraticCurveTo(150, 52, 104, 30); g.fill();
  g.strokeStyle = "rgba(29,94,39,.7)"; g.lineWidth = 2; g.beginPath(); g.moveTo(108, 30); g.lineTo(190, 30); g.stroke();
  return Texture.from(c);
})();
const shadow = new Graphics().ellipse(0, 0, 80, 16).fill({ color: 0x3a2410, alpha: .3 }); shadow.position.set(730, 300); app.stage.addChild(shadow);
const mango = new Sprite(mangoTexture); mango.anchor.set(.5, .55); app.stage.addChild(mango);

// leaves and juice drops burst out on landing; each one is placed from time only (start, velocity, gravity)
const LAND = .62;
const leaves = Array.from({ length: 16 }, () => {
  const g = new Graphics(); const big = 12 + rnd() * 10;
  g.ellipse(0, 0, big * 1.8, big * .8).fill(rnd() > .5 ? 0x4caf50 : 0x2f8f3a); g.rect(-big * 1.8, -1, big * 3.6, 2).fill({ color: 0x1d5e27, alpha: .6 });
  const a = -Math.PI * (.1 + rnd() * .8);
  g.data = { vx: Math.cos(a) * (380 + rnd() * 520), vy: Math.sin(a) * (420 + rnd() * 480), spin: (rnd() - .5) * 14, delay: rnd() * .08 };
  app.stage.addChild(g); return g;
});
const drops = new Graphics(); app.stage.addChild(drops);
const dropList = Array.from({ length: 40 }, () => { const a = -Math.PI * rnd(); return { vx: Math.cos(a) * (150 + rnd() * 380), vy: Math.sin(a) * (220 + rnd() * 420), r: 3 + rnd() * 6, c: rnd() > .4 ? 0xffa21a : 0xff5e3a }; });
const G = 1300;
function place(t) {
  const k = t - LAND;
  leaves.forEach(g => {
    const d = g.data, q = k - d.delay;
    g.visible = q > 0 && q < 2.4;
    // leaves slow down quickly in the air and then sail down
    const drag = 1 - Math.exp(-q * 2.4);
    g.position.set(730 + d.vx * drag / 2.4, 230 + d.vy * drag / 2.4 + 90 * q * q);
    g.rotation = d.spin * drag + Math.sin(q * 5) * .4;
    g.alpha = Math.max(0, 1 - q / 2.4);
  });
  drops.clear();
  if (k > 0 && k < 1.1) dropList.forEach(d => {
    const x = 730 + d.vx * k, y = 240 + d.vy * k + .5 * G * k * k;
    drops.circle(x, y, d.r * (1 - k / 1.1)).fill({ color: d.c, alpha: 1 - k / 1.1 });
  });
}

const m = { y: -200, rot: -1.2, sx: 1, sy: 1, x: 730 };
const tl = gsap.timeline({ repeat: -1, repeatDelay: 1 });
// the mango falls, squashes on the medallion and springs back
tl.fromTo(m, { y: -200, rot: -1.6, sx: .9, sy: 1.15 }, { y: 228, rot: 0, sx: 1, sy: 1, duration: LAND, ease: "power2.in" }, 0);
tl.to(m, { sx: 1.28, sy: .72, duration: .08, ease: "power1.out" }, LAND);
tl.to(m, { sx: 1, sy: 1, duration: .9, ease: "elastic.out(1.2, .3)" }, LAND + .08);
tl.set("#medal", { visibility: "visible" }, .3);
tl.from("#medal", { scale: 0, duration: .55, ease: "back.out(2.2)" }, .3);
tl.to("#medal", { scale: .94, duration: .08, yoyo: true, repeat: 1 }, LAND);
// the frosted card grows out of the medallion, the name pops letter by letter
tl.set(["#card", "#branch"], { visibility: "visible" }, .8);
tl.fromTo("#card", { clipPath: "inset(0 100% 0 0 round 28px)" }, { clipPath: "inset(-30px -60px -60px -10px round 28px)", duration: .6, ease: "power3.out" }, .8);
const split = SplitText.create("#name", { type: "chars" });
tl.from(split.chars, { y: 50, scale: .4, opacity: 0, duration: .5, ease: "back.out(3)", stagger: .05 }, 1.0);
tl.from("#line", { opacity: 0, y: 12, duration: .4 }, 1.4);
tl.from("#quote", { opacity: 0, y: 12, duration: .4 }, 1.6);
// the branch is the remaining time, its leaves fall off one by one
tl.fromTo("#branch", { scaleX: 0 }, { scaleX: 1, duration: .5, ease: "power2.out" }, 1.0);
tl.to("#branch", { scaleX: 0, duration: 4.2, ease: "none" }, 1.6);
tl.to("#branch i", { y: 60, rotate: 90, opacity: 0, duration: .6, stagger: { each: -1, from: "end" }, ease: "power1.in" }, 2.2);
// exit: the card shrinks back into the medallion, the mango rolls away, the medallion pops out
tl.to("#card", { clipPath: "inset(0 100% 0 0 round 28px)", duration: .4, ease: "power3.in" }, 6.0);
tl.to(m, { x: 1000, rot: 6, y: 1200, duration: .8, ease: "power2.in" }, 6.2);
tl.to("#medal", { scale: 0, duration: .35, ease: "back.in(2)" }, 6.4);
if (at) tl.pause(Number(at));

gsap.ticker.add(() => {
  const t = tl.time();
  mango.position.set(m.x, m.y); mango.rotation = m.rot; mango.scale.set(.82 * m.sx, .82 * m.sy);
  shadow.visible = t > .2 && t < 6.3; shadow.scale.set(Math.min(1, Math.max(.2, (m.y + 200) / 428)));
  place(t);
  app.renderer.render(app.stage);
});
</script>
</body>
</html>
