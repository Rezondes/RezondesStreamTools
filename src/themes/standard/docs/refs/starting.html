<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Standard Starting Pixi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.js"></script>
<style>
  :root { --accent: #7c5cff; --accent2: #22d3ee; --text: #ffffff; --muted: #a1a1b5; --card: #14141c; --bg: #0b0b12; --radius: 16px; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, sans-serif; }
  canvas { position: absolute; inset: 0; }
  /* grain against banding: a small noise tile, barely visible */
  .grain { position: absolute; inset: 0; opacity: .025; mix-blend-mode: overlay; pointer-events: none; }
  /* vignette: the edges stay dark, so the fields read as light in a room */
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(11,11,18,.85) 100%); pointer-events: none; }
  .top { position: absolute; left: 80px; right: 80px; top: 56px; display: flex; justify-content: space-between; font-size: 24px; }
  .channel { font-weight: 800; letter-spacing: .08em; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; color: transparent; }
  .muted { color: var(--muted); font-weight: 500; }
  .center { position: absolute; left: 0; right: 0; top: 330px; display: grid; justify-items: center; gap: 22px; text-align: center; }
  .eyebrow { font-size: 30px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .title { font-size: 104px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; margin: 0; }
  .title .char { display: inline-block; }
  .clock { display: flex; font-size: 132px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: 18px; }
  /* one window per digit: the column inside rolls up when the digit changes */
  .digit { position: relative; display: inline-block; width: .62em; height: 1.1em; overflow: hidden; }
  .digit span, .colon { background: linear-gradient(90deg, var(--accent), var(--accent2)); background-size: 400% 100%; -webkit-background-clip: text; color: transparent; }
  .digit span { position: absolute; left: 0; right: 0; text-align: center; }
  .colon { display: inline-block; width: .32em; text-align: center; }
  .bar { position: relative; width: 760px; height: 10px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 0 24px rgba(124,92,255,.6); }
  .shine { position: absolute; top: 0; bottom: 0; width: 120px; left: -140px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); mix-blend-mode: soft-light; }
  .ticker { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-size: 24px; color: var(--muted); }
</style>
</head>
<body>
<div class="vignette"></div>
<canvas class="grain" id="grain" width="256" height="256" style="width:1920px;height:1080px;image-rendering:pixelated"></canvas>
<header class="top"><span class="channel">REZONDES</span><span class="muted" id="time">20:00</span></header>
<main class="center">
  <p class="eyebrow" id="eyebrow">Gleich geht's los</p>
  <h1 class="title" id="title">Stream startet gleich</h1>
  <div class="clock" id="clock"></div>
  <div class="bar" id="bar"><span class="fill" id="fill"></span><span class="shine" id="shine"></span></div>
</main>
<footer class="ticker" id="ticker">Heute: Gemütlicher Abend mit Indie-Games</footer>
<script type="module">
gsap.registerPlugin(SplitText);
gsap.ticker.lagSmoothing(0);
const at = new URLSearchParams(location.search).get("t");
await document.fonts.ready;
const hash = (a, b, c = 0) => { const v = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return v - Math.floor(v); };
const mix = (a, b, k) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const [x, y] = [p(a), p(b)]; return (x.map((v, i) => Math.round(v + (y[i] - v) * k))).reduce((n, v) => n * 256 + v, 0); };
const ACCENT = "#7c5cff", ACCENT2 = "#22d3ee";

// grain: one noise tile, stretched; static so it never flickers
const g = document.getElementById("grain").getContext("2d"), img = g.createImageData(256, 256);
for (let i = 0; i < img.data.length; i += 4) { const v = hash(i, 7) * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
g.putImageData(img, 0, 0);

const app = new PIXI.Application();
await app.init({ width: 1920, height: 1080, antialias: true, autoStart: false, backgroundAlpha: 0, preference: "webgl" });
document.body.prepend(app.canvas);
const { Container, Sprite, Texture, BlurFilter } = PIXI;

// soft round texture for the light fields and the dust
const soft = (size, inner) => { const c = document.createElement("canvas"); c.width = c.height = size; const x = c.getContext("2d");
  const gr = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(inner, "rgba(255,255,255,.45)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = gr; x.fillRect(0, 0, size, size); return Texture.from(c); };
const fieldTex = soft(512, .35), dotTex = soft(32, .25);

// light fields: four large soft fields on closed orbits, period LOOP s, colors between the two accents
const LOOP = 24, FIELDS = [
  { cx: 430, cy: 330, rx: 220, ry: 120, r: 560, mix: 0, phase: 0 },
  { cx: 1500, cy: 760, rx: 240, ry: 130, r: 600, mix: 1, phase: .35 },
  { cx: 1320, cy: 220, rx: 200, ry: 100, r: 440, mix: .55, phase: .6 },
  { cx: 620, cy: 900, rx: 240, ry: 90, r: 480, mix: .9, phase: .15 },
];
const fieldLayer = new Container(); fieldLayer.blendMode = "add"; fieldLayer.filters = [new BlurFilter({ strength: 40, quality: 4 })];
const fields = FIELDS.map(f => { const s = new Sprite(fieldTex); s.anchor.set(.5); s.tint = mix(ACCENT, ACCENT2, f.mix); fieldLayer.addChild(s); return { ...f, s }; });

// light dust: rises slowly, each mote glows up and down on its own rhythm
const dustLayer = new Container(); dustLayer.blendMode = "add";
const DUST = Array.from({ length: 70 }, (_, i) => ({ x: hash(i, 1) * 1920, y: hash(i, 2) * 1080, v: 14 + hash(i, 3) * 26, sway: 10 + hash(i, 4) * 30, size: 3 + hash(i, 5) * 7, tw: .3 + hash(i, 6) * .6, ph: hash(i, 7) * 6.28, c: mix(ACCENT, ACCENT2, hash(i, 8)) }));
const motes = DUST.map(d => { const s = new Sprite(dotTex); s.anchor.set(.5); s.tint = d.c; dustLayer.addChild(s); return { ...d, s }; });
app.stage.addChild(fieldLayer, dustLayer);

const INTRO = 1.2;
function paint(t) {
  const on = Math.min(1, t / INTRO);
  for (const f of fields) {
    const a = ((t / LOOP) + f.phase) * Math.PI * 2;
    f.s.position.set(f.cx + Math.cos(a) * f.rx, f.cy + Math.sin(a * 2) * f.ry);
    const breathe = .85 + .15 * Math.sin(a * 3);
    f.s.width = f.s.height = f.r * 2 * breathe; f.s.alpha = .7 * on * breathe;
  }
  for (const m of motes) {
    const y = ((m.y - t * m.v) % 1180 + 1180) % 1180 - 50;
    m.s.position.set(m.x + Math.sin(t * .4 + m.ph) * m.sway, y);
    m.s.width = m.s.height = m.size * 3; m.s.alpha = on * (.15 + .6 * Math.max(0, Math.sin(t * m.tw * 3 + m.ph)));
  }
}

// countdown: each digit is a window; when it changes, the new digit rolls up from below
const clock = document.getElementById("clock");
const start = 4 * 60 + 58;
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
const slots = fmt(start).split("").map(ch => { const el = document.createElement("span"); el.className = ch === ":" ? "colon" : "digit"; if (ch === ":") el.textContent = ":"; clock.append(el); return el; });
function paintClock(t) {
  const left = Math.max(0, start - Math.floor(t)), prev = fmt(Math.min(start, left + 1)), now = fmt(left), k = Math.min(1, (t % 1) / .35);
  slots.forEach((el, i) => { if (now[i] === ":") return;
    const rolling = t >= 1 && prev[i] !== now[i] && k < 1, e = 1 - Math.pow(1 - k, 3), pos = `background-position:${i * 25}% 0`;
    el.innerHTML = rolling ? `<span style="top:${-e * 110}%;opacity:${1 - e};${pos}">${prev[i]}</span><span style="top:${(1 - e) * 110}%;${pos}">${now[i]}</span>` : `<span style="top:0;${pos}">${now[i]}</span>`; });
  document.getElementById("fill").style.width = `${Math.min(100, 30 + t * 1.6)}%`;
}

const split = new SplitText("#title", { type: "chars", charsClass: "char" });
const tl = gsap.timeline();
tl.from(".top", { opacity: 0, duration: .8 }, .2);
tl.from("#eyebrow", { opacity: 0, y: 14, filter: "blur(6px)", duration: .7, ease: "power2.out" }, .5);
tl.from(split.chars, { opacity: 0, y: 46, filter: "blur(12px)", duration: .9, ease: "power3.out", stagger: .035 }, .8);
tl.from(["#clock", "#bar"], { opacity: 0, y: 20, duration: .8, ease: "power2.out", stagger: .15 }, 1.6);
tl.from("#ticker", { opacity: 0, y: 12, duration: .8, ease: "power2.out" }, 2.2);
// the shine runs over the bar every four seconds
tl.fromTo("#shine", { left: -140 }, { left: 900, duration: 1.2, ease: "power1.inOut", repeat: -1, repeatDelay: 2.8 }, 2.6);
tl.to({}, { duration: 30 }, 0);
if (at) tl.pause(Number(at));
gsap.ticker.add(() => { const t = tl.time(); paint(t); paintClock(t); app.renderer.render(app.stage); });
</script>
</body>
</html>
