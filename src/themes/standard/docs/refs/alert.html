<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Standard Alert Pixi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.js"></script>
<style>
  :root { --accent: #7c5cff; --accent2: #22d3ee; --text: #ffffff; --muted: #a1a1b5; --radius: 16px; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; color: var(--text); font-family: Inter, sans-serif; }
  /* preview only: checker stands for the transparent overlay over a game */
  body { background: repeating-conic-gradient(#3a3d44 0 25%, #33363c 0 50%) 0 0 / 40px 40px; }
  canvas { position: absolute; inset: 0; pointer-events: none; }
  .stage { position: absolute; left: 640px; top: 48px; width: 640px; perspective: 900px; }
  .card { position: relative; box-sizing: border-box; padding: 26px 32px 40px; border-radius: var(--radius); background: rgba(20,20,28,.88);
          box-shadow: 0 18px 50px rgba(0,0,0,.45); transform-origin: 50% 0; visibility: hidden; }
  .glow { position: absolute; inset: -2px; border-radius: calc(var(--radius) + 2px); box-shadow: 0 0 24px rgba(124,92,255,.75), 0 0 48px rgba(34,211,238,.35); opacity: 0; }
  .edge { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .label { display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: 18px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
           background: linear-gradient(90deg, rgba(124,92,255,.25), rgba(34,211,238,.25)); color: #dcd6ff; }
  .name { margin: 16px 0 4px; font-size: 56px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
  .name .char { display: inline-block; background: linear-gradient(90deg, var(--accent), var(--accent2)); background-size: 600% 100%; -webkit-background-clip: text; color: transparent; }
  .line { font-size: 26px; font-weight: 500; }
  .quote { margin-top: 10px; font-size: 21px; color: var(--muted); }
  .bar { position: absolute; left: 32px; right: 32px; bottom: 14px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .shine { position: absolute; top: 0; bottom: 0; width: 90px; left: -100px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent); mix-blend-mode: soft-light; }
</style>
</head>
<body>
<div class="stage">
  <div class="card" id="card">
    <div class="glow" id="glow"></div>
    <svg class="edge" id="edge"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
      <rect id="rim" x="1" y="1" rx="16" ry="16" fill="none" stroke="url(#grad)" stroke-width="2.5"/></svg>
    <span class="label" id="label">Neues Abo</span>
    <div class="name" id="name">Trinity</div>
    <div class="line" id="line">hat abonniert!</div>
    <div class="quote" id="quote">"Endlich dabei, grüsse an alle!"</div>
    <div class="bar"><span class="fill" id="fill"></span><span class="shine" id="shine"></span></div>
  </div>
</div>
<script type="module">
gsap.registerPlugin(SplitText);
gsap.ticker.lagSmoothing(0);
const at = new URLSearchParams(location.search).get("t");
await document.fonts.ready;
const hash = (a, b, c = 0) => { const v = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return v - Math.floor(v); };
const mix = (k) => { const a = [0x7c, 0x5c, 0xff], b = [0x22, 0xd3, 0xee]; return a.map((v, i) => Math.round(v + (b[i] - v) * k)).reduce((n, v) => n * 256 + v, 0); };

// the edge: the rect gets the size of the card; its dash shows the drawn part of the perimeter
const card = document.getElementById("card"), rim = document.getElementById("rim");
card.style.visibility = "visible";
const W = card.offsetWidth, H = card.offsetHeight, R = 16;
card.style.visibility = "hidden";
rim.setAttribute("width", W - 2); rim.setAttribute("height", H - 2);
const PERIMETER = 2 * (W - 2 + H - 2) - 8 * R + 2 * Math.PI * R;
rim.style.strokeDasharray = `${PERIMETER}`;

const app = new PIXI.Application();
await app.init({ width: 1920, height: 1080, antialias: true, autoStart: false, backgroundAlpha: 0, preference: "webgl" });
document.body.append(app.canvas);
const { Container, Sprite, Texture } = PIXI;
const dot = (() => { const c = document.createElement("canvas"); c.width = c.height = 32; const x = c.getContext("2d"); const g = x.createRadialGradient(16, 16, 0, 16, 16, 16);
  g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(.3, "rgba(255,255,255,.6)"); g.addColorStop(1, "rgba(255,255,255,0)"); x.fillStyle = g; x.fillRect(0, 0, 32, 32); return Texture.from(c); })();

// sparks: start on the card edge, fly outwards with a little gravity and fade; placed from time only
const CX = 640, CY = 48, SPARKS = 36, BURST = 1.0, LIFE = 1.1;
const layer = new Container(); layer.blendMode = "add"; app.stage.addChild(layer);
const edgePoint = u => { const p = u * 2 * (W + H); if (p < W) return [p, 0, 0, -1]; if (p < W + H) return [W, p - W, 1, 0]; if (p < 2 * W + H) return [W - (p - W - H), H, 0, 1]; return [0, H - (p - 2 * W - H), -1, 0]; };
const sparks = Array.from({ length: SPARKS }, (_, i) => { const s = new Sprite(dot); s.anchor.set(.5); s.tint = mix(hash(i, 4)); layer.addChild(s);
  const [x, y, nx, ny] = edgePoint(hash(i, 1)), speed = 160 + hash(i, 2) * 320, spread = (hash(i, 3) - .5) * 1.2;
  return { s, x: CX + x, y: CY + y, vx: (nx + spread * ny) * speed, vy: (ny - spread * nx) * speed - 60, size: 8 + hash(i, 5) * 14, delay: hash(i, 6) * .25 }; });
function paint(t) {
  for (const p of sparks) { const k = t - BURST - p.delay; p.s.visible = k > 0 && k < LIFE; if (!p.s.visible) continue;
    p.s.position.set(p.x + p.vx * k, p.y + p.vy * k + 260 * k * k); p.s.width = p.s.height = p.size * (1 - k / LIFE * .6); p.s.alpha = 1 - k / LIFE; }
}

const split = new SplitText("#name", { type: "chars", charsClass: "char" });
split.chars.forEach((c, i) => { c.style.backgroundPosition = `${(i / Math.max(1, split.chars.length - 1)) * 100}% 0`; });
const fillEl = document.getElementById("fill"), timer = { k: 1 };
const OUT = 6.2;
const tl = gsap.timeline({ repeat: -1, repeatDelay: 1 });
tl.set("#card", { visibility: "visible" }, 0);
// in: glides down with a light spring while the edge draws itself once around
tl.fromTo("#card", { y: -60, opacity: 0, scale: .96, filter: "blur(8px)" }, { y: 0, opacity: 1, scale: 1, filter: "blur(0px)", duration: .8, ease: "back.out(1.6)" }, 0);
tl.fromTo("#rim", { strokeDashoffset: PERIMETER }, { strokeDashoffset: 0, duration: .7, ease: "power2.inOut" }, .3);
tl.fromTo("#glow", { opacity: 0 }, { keyframes: [{ opacity: 1, duration: .25 }, { opacity: .25, duration: .9 }], ease: "power1.out" }, 1.0);
tl.from("#label", { opacity: 0, y: 8, duration: .45, ease: "power2.out" }, .55);
tl.from(split.chars, { opacity: 0, y: 30, filter: "blur(10px)", duration: .7, ease: "power3.out", stagger: .04 }, .7);
tl.from("#line", { opacity: 0, y: 10, duration: .5, ease: "power2.out" }, 1.2);
tl.from("#quote", { opacity: 0, y: 10, duration: .5, ease: "power2.out" }, 1.45);
tl.fromTo(timer, { k: 1 }, { k: 0, duration: OUT - 1.4, ease: "none" }, 1.4);
tl.fromTo("#shine", { left: -100 }, { left: 680, duration: 1, ease: "power1.inOut" }, 1.6);
// out: blurs, tilts back a little and fades
tl.to("#card", { opacity: 0, rotateX: 18, y: -24, filter: "blur(10px)", duration: .6, ease: "power2.in" }, OUT);
if (at) tl.pause(Number(at));
gsap.ticker.add(() => { const t = tl.time(); fillEl.style.width = `${timer.k * 100}%`; paint(t); app.renderer.render(app.stage); });
</script>
</body>
</html>
