<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>B Ending Three</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrambleTextPlugin.min.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<style>
  :root { --blueprint: #192a56; --line: #ffffff; --signal: #e67e22; --copper: #d4a373; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--blueprint); font-family: "Roboto Mono", monospace; color: var(--line); }
  canvas { position: absolute; inset: 0; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
              background: linear-gradient(to top, rgba(14,24,52,.9) 0%, rgba(14,24,52,.5) 22%, transparent 40%), radial-gradient(ellipse at 55% 40%, transparent 45%, rgba(6,12,30,.65) 100%); }
  .head { position: absolute; left: 80px; top: 64px; font-size: 20px; letter-spacing: 6px; color: var(--copper); }
  .head b { color: var(--line); }
  .title { position: absolute; left: 0; right: 0; top: 800px; text-align: center; font-size: 96px; font-weight: 700; letter-spacing: 14px; color: var(--signal);
           text-shadow: 0 0 12px rgba(230,126,34,.85), 0 0 40px rgba(230,126,34,.45); }
  .sub { position: absolute; left: 0; right: 0; top: 925px; text-align: center; font-size: 30px; font-weight: 500; letter-spacing: 12px; }
  .card { position: absolute; left: 80px; top: 180px; width: 470px; padding: 22px 26px 26px; box-sizing: border-box;
          background-color: rgba(25,42,86,.9);
          background-image: linear-gradient(rgba(255,255,255,.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.1) 1px, transparent 1px),
                            linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
          background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px; border: 1.5px solid rgba(255,255,255,.9); }
  .card::before, .card::after { content: ""; position: absolute; width: 18px; height: 18px; border: 3px solid var(--signal); }
  .card::before { left: -8px; top: -8px; border-right: 0; border-bottom: 0; }
  .card::after { right: -8px; bottom: -8px; border-left: 0; border-top: 0; }
  .card h2 { margin: 0 0 14px; font-size: 20px; letter-spacing: 6px; color: var(--copper); font-weight: 700; }
  .row { display: flex; justify-content: space-between; font-size: 22px; padding: 10px 0; border-top: 1px dashed rgba(255,255,255,.35); }
  .row b { color: var(--signal); font-weight: 700; }
  .stamp { position: absolute; left: 250px; top: 560px; padding: 10px 22px; border: 5px solid var(--signal); border-radius: 6px; color: var(--signal);
           font-size: 40px; font-weight: 700; letter-spacing: 6px; transform: rotate(-12deg); text-shadow: 0 0 10px rgba(230,126,34,.6); box-shadow: 0 0 18px rgba(230,126,34,.35), inset 0 0 12px rgba(230,126,34,.25); }
  .block { position: absolute; right: 60px; bottom: 30px; width: 380px; border: 1.5px solid rgba(255,255,255,.85); font-size: 18px; font-weight: 500; }
  .block div { display: flex; border-top: 1.5px solid rgba(255,255,255,.85); }
  .block div:first-child { border-top: 0; }
  .block span { padding: 9px 14px; flex: 1; }
  .block span + span { border-left: 1.5px solid rgba(255,255,255,.85); }
  .block .copper { color: var(--copper); }
  .title, .sub, .head, .block, .card, .stamp { opacity: 0; }
</style>
</head>
<body>
<div class="vignette"></div>
<div class="head" id="head"><b>BAUPLAN 03</b> &nbsp;//&nbsp; RICHTFEST &nbsp;//&nbsp; KANAL REZONDES</div>
<div class="card" id="card">
  <h2>ABNAHMEPROTOKOLL</h2>
  <div class="row"><span>Neue Dachdecker</span><b data-to="12">0</b></div>
  <div class="row"><span>Abos</span><b data-to="3">0</b></div>
  <div class="row"><span>Raids</span><b data-to="1">0</b></div>
  <div class="row"><span>Bits</span><b data-to="500">0</b></div>
  <div class="row"><span>Gelegte Ziegel</span><b data-to="1284">0</b></div>
</div>
<div class="stamp" id="stamp">ABGENOMMEN</div>
<div class="title" id="title">FEIERABEND!</div>
<div class="sub" id="sub">DANKE FÜRS MITDECKEN</div>
<div class="block" id="block">
  <div><span>PROJEKT: STREAM</span></div>
  <div><span>RICHTFEST</span><span>BLATT 3/3</span></div>
  <div><span>STATUS</span><span class="copper">ABGENOMMEN</span></div>
</div>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

gsap.registerPlugin(ScrambleTextPlugin);
gsap.ticker.lagSmoothing(0);
const rand = gsap.utils.random;
const at = new URLSearchParams(location.search).get("t");

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1); renderer.setSize(1920, 1080);
document.body.insertBefore(renderer.domElement, document.body.firstChild);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1d2550, 22, 55);
const camera = new THREE.PerspectiveCamera(36, 1920 / 1080, .1, 200);
camera.setViewOffset(1920, 1080, -230, 0, 1920, 1080);          // house sits right of centre, card on the left
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1920, 1080), .55, .5, .42));
composer.addPass(new OutputPass());

// evening sky: blueprint blue on top, a warm after-work glow at the horizon
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x14224a) }, glow: { value: new THREE.Color(0x8a3d16) } },
  vertexShader: "varying vec3 p; void main() { p = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: "uniform vec3 top; uniform vec3 glow; varying vec3 p; void main() { float h = clamp(p.y * 2.2 + .12, 0.0, 1.0); gl_FragColor = vec4(mix(glow, top, pow(h, .6)), 1.0); }",
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(90, 32, 16), skyMat));
scene.add(new THREE.HemisphereLight(0xa8bfff, 0x2a1408, 1.1));
const sun = new THREE.DirectionalLight(0xffb070, 1.6); sun.position.set(10, 4, -12); scene.add(sun);
const fill = new THREE.DirectionalLight(0xbfd0ff, .8); fill.position.set(-8, 10, 10); scene.add(fill);

const grid = (size, div, opacity) => { const g = new THREE.GridHelper(size, div, 0xffffff, 0xffffff); g.material.transparent = true; g.material.opacity = opacity; g.material.depthWrite = false; scene.add(g); };
grid(100, 50, .12); grid(100, 500, .03);

const mat = {
  orange: { line: new THREE.LineBasicMaterial({ color: 0xff8a2a }), fill: new THREE.MeshBasicMaterial({ color: 0xe67e22, transparent: true, opacity: .22, depthWrite: false }) },
  white: { line: new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .62 }), fill: new THREE.MeshBasicMaterial({ color: 0x5b7fc4, transparent: true, opacity: .1, depthWrite: false }) },
};
function beam(a, b, size, kind) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), len = A.distanceTo(B);
  const pivot = new THREE.Group(); pivot.position.copy(A); pivot.lookAt(B);
  const geo = new THREE.BoxGeometry(size, size * 2.2, len); geo.translate(0, 0, len / 2);
  pivot.add(new THREE.Mesh(geo, kind.fill), new THREE.LineSegments(new THREE.EdgesGeometry(geo), kind.line));
  scene.add(pivot); return pivot;
}
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);

// house walls as a timber frame on the ground, roof frame on top
const half = 4.2, rise = 3.25, wallH = 2.7, zFront = .5, zBack = -6.5, W = half - .25;
const wallFill = new THREE.Mesh(new THREE.BoxGeometry(W * 2, wallH, 6.4), new THREE.MeshPhongMaterial({ color: 0x24345c, transparent: true, opacity: .55, depthWrite: false }));
wallFill.position.set(0, wallH / 2, -3); scene.add(wallFill);
{ const edges = new THREE.LineSegments(new THREE.EdgesGeometry(wallFill.geometry), mat.white.line); edges.position.copy(wallFill.position); scene.add(edges); }
[[-W, .2], [W, .2], [-W, -6.2], [W, -6.2], [0, .2], [-W / 2, .2], [W / 2, .2]].forEach(([x, z]) => beam([x, 0, z], [x, wallH, z], .14, mat.white));
// lit windows and door on the front, lights come on one by one
const glowMat = () => new THREE.MeshBasicMaterial({ color: 0xe8741e, transparent: true, opacity: 0 });
const windows = [[-2.6, 1.55], [-1, 1.55], [1, 1.55], [2.6, 1.55]].map(([x, y]) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(.9, 1), glowMat()); m.position.set(x, y, .21); scene.add(m);
  const frame = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(.9, 1)), mat.white.line); frame.position.copy(m.position); scene.add(frame);
  return m;
});
const door = new THREE.Mesh(new THREE.PlaneGeometry(.9, 1.8), glowMat()); door.position.set(0, .9, .21); scene.add(door);

const Y = wallH;
[0, -1.5, -3, -4.5, -6].forEach((z, index) => {
  const kind = index === 0 ? mat.orange : mat.white;
  const L = [-half, Y, z], R = [half, Y, z], P = [0, Y + rise, z], M = [0, Y, z];
  const over = k => mix(P, k, 1.12);
  beam(over(L), P, .1, kind); beam(over(R), P, .1, kind); beam(L, R, .1, kind);
  beam(mix(L, P, .58), mix(R, P, .58), .08, kind); beam(M, P, .08, kind);
});

// finished roof: slate with scattered copper, white plan edges, copper ridge
const rows = 11, cols = 14, tileGeo = new THREE.BoxGeometry(.5, .035, .46);
const slateMat = new THREE.MeshPhongMaterial({ color: 0x2c3e50, shininess: 40, specular: 0x445566 });
const copperMat = new THREE.MeshPhongMaterial({ color: 0xd08a4c, shininess: 90, specular: 0xffd3a0, emissive: 0x3a1806 });
const slates = new THREE.InstancedMesh(tileGeo, slateMat, rows * cols * 2), coppers = new THREE.InstancedMesh(tileGeo, copperMat, rows * cols * 2);
const edgeBase = Array.from(new THREE.EdgesGeometry(tileGeo).attributes.position.array), matrices = [];
let ns = 0, nc = 0;
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), pos = new THREE.Vector3(), one = new THREE.Vector3(1, 1, 1);
[-1, 1].forEach(sideSign => {
  const slope = Math.atan2(rise, half);
  for (let r = 0; r < rows; r++) {
    const k = (r + .5) / rows, x = sideSign * (half * 1.12 - k * half * 1.12), y = Y - rise * .12 + k * rise * 1.12 + .2;
    for (let c = 0; c < cols; c++) {
      const z = zFront - .26 - c * .5 + (r % 2 ? .25 : 0);
      if (z < zBack + .1) continue;
      pos.set(x, y, z); e.set(.04 * (r % 2 ? 1 : -1), 0, sideSign * -slope - .05 * sideSign); q.setFromEuler(e); m4.compose(pos, q, one);
      if (Math.sin(r * 12.9898 + c * 78.233 + sideSign * 3.1) * 43758.5453 % 1 > .82) coppers.setMatrixAt(nc++, m4); else slates.setMatrixAt(ns++, m4);
      matrices.push(m4.clone());
    }
  }
});
slates.count = ns; coppers.count = nc; scene.add(slates, coppers);
const edgePos = new Float32Array(matrices.length * edgeBase.length), v3 = new THREE.Vector3();
matrices.forEach((mm, t) => { for (let i = 0; i < edgeBase.length; i += 3) { v3.set(edgeBase[i], edgeBase[i + 1], edgeBase[i + 2]).applyMatrix4(mm); edgePos.set([v3.x, v3.y, v3.z], t * edgeBase.length + i); } });
const edgeGeo = new THREE.BufferGeometry(); edgeGeo.setAttribute("position", new THREE.BufferAttribute(edgePos, 3));
scene.add(new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: 0xbcd0ee, transparent: true, opacity: .5 })));
const ridge = new THREE.Mesh(new THREE.CylinderGeometry(.16, .16, zFront - zBack + .3, 16), copperMat);
ridge.rotation.x = Math.PI / 2; ridge.position.set(0, Y + rise + .28, (zFront + zBack) / 2); scene.add(ridge);

// chimney with soft smoke
const chimney = new THREE.Mesh(new THREE.BoxGeometry(.6, 1.6, .6), new THREE.MeshPhongMaterial({ color: 0x1f2c44 }));
chimney.position.set(1.6, Y + rise - .3, -4.2); scene.add(chimney);
{ const edges = new THREE.LineSegments(new THREE.EdgesGeometry(chimney.geometry), mat.white.line); edges.position.copy(chimney.position); scene.add(edges); }
const softTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"); const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32); grad.addColorStop(0, "rgba(255,255,255,1)"); grad.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = grad; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
for (let i = 0; i < 14; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: 0x9aa8c8, transparent: true, opacity: 0, depthWrite: false })); scene.add(s);
  const base = chimney.position.clone().add(new THREE.Vector3(0, .9, 0));
  gsap.timeline({ repeat: -1, delay: i * .45 })
    .fromTo(s.position, { x: base.x, y: base.y, z: base.z }, { x: base.x + rand(.8, 1.6), y: base.y + rand(2.5, 3.5), z: base.z + rand(-.4, .4), duration: 6.3, ease: "sine.out" }, 0)
    .fromTo(s.scale, { x: .3, y: .3 }, { x: 1.6, y: 1.6, duration: 6.3 }, 0)
    .fromTo(s.material, { opacity: .35 }, { opacity: 0, duration: 6.3, ease: "power1.in" }, 0);
}

// topping-out wreath on a small pole at the front gable, ribbons wave in the wind
const wreath = new THREE.Group(); wreath.position.set(0, Y + rise + .3, zFront - .1); scene.add(wreath);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(.04, .05, 1.6, 8), new THREE.MeshPhongMaterial({ color: 0xc99a5b })); pole.position.y = .8; wreath.add(pole);
const ring = new THREE.Mesh(new THREE.TorusGeometry(.42, .11, 10, 32), new THREE.MeshPhongMaterial({ color: 0x3f7a4a, shininess: 10 })); ring.position.y = 1.35; wreath.add(ring);
const ribbons = [0xe67e22, 0xd4a373, 0xffffff, 0xd35400, 0x7fa8ff, 0xe67e22].map((color, i) => {
  const geo = new THREE.PlaneGeometry(.09, 1.5, 1, 14); geo.translate(0, -.75, 0);
  const rb = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));
  const a = (i / 6) * Math.PI * 2; rb.position.set(Math.cos(a) * .4, 1.3, Math.sin(a) * .12); rb.userData.base = geo.attributes.position.array.slice(); rb.userData.phase = i;
  wreath.add(rb); return rb;
});
wreath.scale.set(1, .0001, 1);

// fireworks: bursts of glowing points over the roof
const bursts = [];
function burst() {
  const n = 110, posArr = new Float32Array(n * 3), vel = [];
  const origin = new THREE.Vector3(rand(-6, 6), rand(9, 12.5), rand(-8, -2));
  for (let i = 0; i < n; i++) { posArr.set([origin.x, origin.y, origin.z], i * 3); vel.push(new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize().multiplyScalar(rand(.06, .11))); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(posArr, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: rand([0xffa24a, 0xd4a373, 0xffffff, 0xff7a2a]), size: .13, transparent: true, map: softTex, depthWrite: false, blending: THREE.AdditiveBlending }));
  pts.frustumCulled = false; scene.add(pts); const b = { pts, vel, life: 1 }; bursts.push(b);
  gsap.to(b, { life: 0, duration: 2.2, ease: "power1.in" });
}
function stepBursts(dt) {
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i], arr = b.pts.geometry.attributes.position.array;
    b.vel.forEach((v, k) => { v.y -= .0016 * dt; v.multiplyScalar(Math.pow(.985, dt)); arr[k * 3] += v.x * dt; arr[k * 3 + 1] += v.y * dt; arr[k * 3 + 2] += v.z * dt; });
    b.pts.geometry.attributes.position.needsUpdate = true; b.pts.material.opacity = b.life;
    if (b.life <= 0) { scene.remove(b.pts); b.pts.geometry.dispose(); bursts.splice(i, 1); }
  }
}

// choreography: close on the wreath, pull back to the whole house, lights on, protocol, stamp, fireworks
const cam = { radius: 12, height: Y + rise + 1.8, angle: .15, look: Y + rise };
const tl = gsap.timeline();
tl.to(cam, { radius: 24, height: 8, look: 1.9, angle: .55, duration: 5, ease: "power3.inOut" }, 0);
tl.to(wreath.scale, { y: 1, duration: .9, ease: "back.out(1.8)" }, .6);
tl.to(windows.map(w => w.material).concat(door.material), { opacity: 1, duration: .25, stagger: .35, ease: "steps(3)" }, 2.2);
tl.to(["#head", "#block"], { opacity: 1, duration: .6, stagger: .2 }, .4);
tl.to("#title", { opacity: 1, duration: .1 }, 3.2);
tl.from("#title", { duration: 1.2, scrambleText: { text: "FEIERABEND!", chars: "01ABCDEFGHIJKLMNOPQRSTUVWXYZ/", revealDelay: .2, speed: .5 } }, 3.2);
tl.fromTo("#sub", { opacity: 0, letterSpacing: "30px" }, { opacity: 1, letterSpacing: "12px", duration: 1.2, ease: "power3.out" }, 3.8);
tl.fromTo("#card", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: .6, ease: "power3.out" }, 4.2);
document.querySelectorAll(".row b").forEach((el, i) => {
  const counter = { v: 0 };
  tl.to(counter, { v: Number(el.dataset.to), duration: 1, ease: "power2.out", onUpdate: () => { el.textContent = Math.round(counter.v).toLocaleString("de-DE"); } }, 4.5 + i * .18);
});
tl.fromTo("#stamp", { opacity: 0, scale: 3.2, rotation: -28 }, { opacity: 1, scale: 1, rotation: -12, duration: .35, ease: "power4.in" }, 6);
tl.fromTo("#card", { x: 0 }, { x: 6, duration: .05, yoyo: true, repeat: 3 }, 6.35);
tl.call(burst, null, 6.4); tl.call(burst, null, 6.9); tl.call(burst, null, 7.5);
if (at) { tl.pause(); tl.seek(Number(at), false); }
gsap.delayedCall(9, function loop() { burst(); gsap.delayedCall(rand(1.5, 3.5), loop); });

const center = new THREE.Vector3(0, 0, -3);
gsap.ticker.add((time, deltaMs) => {
  const dt = Math.min(3, deltaMs / 16.67), t = at ? Number(at) : time;
  stepBursts(dt);
  ribbons.forEach(rb => {
    const arr = rb.geometry.attributes.position.array, base = rb.userData.base;
    for (let i = 0; i < arr.length; i += 3) { const down = -base[i + 1]; arr[i + 2] = base[i + 2] + Math.sin(t * 3.2 + down * 3 + rb.userData.phase) * down * .18; arr[i] = base[i] + down * .25; }
    rb.geometry.attributes.position.needsUpdate = true;
  });
  const angle = cam.angle + Math.max(0, t - 5) * .035;
  center.y = cam.look;
  camera.position.set(Math.sin(angle) * cam.radius, cam.height, -3 + Math.cos(angle) * cam.radius);
  camera.lookAt(center);
  composer.render();
});
</script>
</body>
</html>
