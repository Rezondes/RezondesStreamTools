# Docker-Image auf ghcr.io: bei jedem Push auf main (oder von Hand) erst alle Prüfungen (npm run verify),
# dann bauen und als ghcr.io/<owner>/<repo>:latest und :sha-<commit> veröffentlichen.
# Das Package ist anfangs privat; einmalig unter Package settings auf Public stellen.
name: Docker-Image

on:
  push:
    branches: [main]
  workflow_dispatch:

# Ein neuer Push bricht einen noch laufenden Lauf ab, veröffentlicht wird immer der neueste Stand
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Name in Kleinbuchstaben, Tags latest und sha-<commit>, Label verknüpft das Package mit dem Repo
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Kein Layer-Cache: der Upload in den Actions-Cache (node_modules, ffmpeg) dauerte Minuten, der Build ohne Cache
          # braucht nur Sekunden mehr
