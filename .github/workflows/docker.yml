# Docker image on ghcr.io: on every push to main (or by hand) first all checks (npm run verify with the Rust workspace)
# and the contract tests against the Rust server in one job, then build and publish as ghcr.io/<owner>/<repo>:latest and
# :sha-<commit>.
# The package is private at first; switch it to public once under Package settings.
name: Docker-Image

on:
  push:
    branches: [main]
  workflow_dispatch:

# A new push cancels a run that is still going, the newest state is always the one published
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Only the image job may publish; verify runs code from devDependencies and does not need it
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The same toolchain as server-rs/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      # Also saved after a failed run, otherwise the next run compiles the whole workspace again
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs
          cache-on-failure: true
      - run: npm ci --ignore-scripts
      - run: npm run verify
      # The contract tests start the Rust server against the fake providers; in the same job they reuse the built
      # pages (dist) and the compiled workspace from verify instead of building both again
      - run: npm run contract

  image:
    needs: verify
    # Only main is published, also when started by hand on another branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Name in lower case, tags latest and sha-<commit>, the label links the package to the repo
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No layer cache: the upload to the Actions cache (node_modules, ffmpeg) took minutes, the build without cache
          # needs only seconds more
