<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220">
  <!-- Neon-Echse von oben, läuft auf der Stelle: Beine im Kreuzgang, Schwanz wedelt, Zunge zuckt -->
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" stroke="#39FF14" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="rgba(0,0,0,0.75)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0;0 3;0 0" dur="0.36s" repeatCount="indefinite"/>

      <!-- Schwanz -->
      <path d="M128 110 C 95 112, 70 96, 45 108 S 12 132, 6 118" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="-9 128 110;9 128 110;-9 128 110" dur="0.72s" repeatCount="indefinite"/>
      </path>

      <!-- Beine: vorne links + hinten rechts und vorne rechts + hinten links im Takt -->
      <g fill="none">
        <path d="M258 92 L 272 56 L 288 48 M272 56 L 266 42 M272 56 L 282 40">
          <animateTransform attributeName="transform" type="rotate" values="-22 258 92;22 258 92;-22 258 92" dur="0.72s" repeatCount="indefinite"/>
        </path>
        <path d="M258 128 L 272 164 L 288 172 M272 164 L 266 178 M272 164 L 282 180">
          <animateTransform attributeName="transform" type="rotate" values="22 258 128;-22 258 128;22 258 128" dur="0.72s" repeatCount="indefinite"/>
        </path>
        <path d="M150 92 L 132 58 L 116 50 M132 58 L 138 42 M132 58 L 122 42">
          <animateTransform attributeName="transform" type="rotate" values="22 150 92;-22 150 92;22 150 92" dur="0.72s" repeatCount="indefinite"/>
        </path>
        <path d="M150 128 L 132 162 L 116 170 M132 162 L 138 178 M132 162 L 122 178">
          <animateTransform attributeName="transform" type="rotate" values="-22 150 128;22 150 128;-22 150 128" dur="0.72s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- Körper mit Rückenmuster -->
      <ellipse cx="200" cy="110" rx="82" ry="27"/>
      <g fill="#39FF14" stroke="none" opacity="0.8">
        <circle cx="160" cy="110" r="4"/><circle cx="185" cy="104" r="4"/><circle cx="185" cy="116" r="4"/>
        <circle cx="212" cy="110" r="4"/><circle cx="238" cy="104" r="4"/><circle cx="238" cy="116" r="4"/>
      </g>

      <!-- Zunge: schnellt alle paar Takte heraus -->
      <path d="M338 110 L 372 110 M372 110 L 384 102 M372 110 L 384 118" fill="none" stroke-width="3">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.75;0.8;1" dur="1.44s" repeatCount="indefinite"/>
      </path>

      <!-- Kopf mit Augen -->
      <path d="M276 110 C 280 88, 312 86, 330 98 C 344 106, 344 114, 330 122 C 312 134, 280 132, 276 110 Z"/>
      <g fill="#d8ffcc" stroke="none">
        <circle cx="314" cy="98" r="4.5"/><circle cx="314" cy="122" r="4.5"/>
      </g>
    </g>
  </g>
</svg>
