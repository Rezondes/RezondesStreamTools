services:
  overlays:
    build: .
    # Nur auf diesem Rechner erreichbar; OBS läuft ja lokal
    ports:
      - "127.0.0.1:8089:8080"
    env_file: server.env
    environment:
      PUBLIC_URL: http://localhost:8089
    volumes:
      - tokens:/data
      # Trigger-Regeln und Medien: auf dem PC oder im Browser (/#/triggers) bearbeiten, ohne Neustart.
      # Beschreibbar, damit der Editor speichern und Medien hochladen kann.
      - ./config:/app/config
    restart: unless-stopped

volumes:
  tokens:
