# Public operation on a server with a domain, in addition to docker-compose.yml:
#   docker compose --env-file server.env -f docker-compose.yml -f docker-compose.public.yml up -d --build
# DOMAIN is in server.env. Caddy accepts ports 80 and 443, fetches the certificate and talks internally to the
# overlay server; its port is not reachable from outside.
services:
  overlays:
    ports: !reset []
    environment:
      PUBLIC_URL: https://${DOMAIN:?DOMAIN fehlt in server.env}

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt in server.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - overlays
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
