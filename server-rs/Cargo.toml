# Rust server of RST (see RUST-PLAN.md): four crates by layer. rst-domain (pure rules) depends on no other project
# crate, rst-app (use cases, ports) on rst-domain, rst-infra (adapters) on rst-app, rst-server on all of them.
[workspace]
resolver = "3"
members = ["crates/rst-domain", "crates/rst-app", "crates/rst-infra", "crates/rst-server"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
rst-domain = { path = "crates/rst-domain" }
rst-app = { path = "crates/rst-app" }
rst-infra = { path = "crates/rst-infra" }
axum = "0.8.9"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
http-body-util = "0.1.5"
regex = "1.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
ts-rs = "12.0.1"
zeroize = "1.9.1"

# Debug builds lightly optimized and their dependencies (crypto, SQLite) more, so tests over large files stay fast
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
